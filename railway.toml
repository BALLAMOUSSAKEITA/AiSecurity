# Configuration Railway – monorepo AiSecurity
# Deux services : backend (FastAPI) + frontend (React/Vite)

[build]
# Railway détecte automatiquement Python (requirements.txt) et Node (package.json)
# selon le répertoire racine de chaque service.
# Ces valeurs sont surchargées par service dans le dashboard Railway.

[[services]]
name = "backend"
source = "backend"

[services.build]
buildCommand = "pip install -r requirements.txt"

[services.deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[[services]]
name = "frontend"
source = "frontend"

[services.build]
buildCommand = "npm install && npm run build"

[services.deploy]
startCommand = "npm run start"
